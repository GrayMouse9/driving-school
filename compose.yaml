services:
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LISTEN_ADDR: ":18080"
      WORLD_FILE: ${WORLD_FILE:?Set WORLD_FILE in .env}
      CLIENT_DIR: ${CLIENT_DIR:?Set CLIENT_DIR in .env}
      AI_SERVICE_URL: http://host.docker.internal:18082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:18080"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  ai:
    build: ./ai-service
    network_mode: host
    environment:
      # Bind only to the Docker bridge; Ollama stays on host loopback.
      AI_BIND_HOST: ${AI_BIND_HOST:?Set AI_BIND_HOST to the Docker bridge gateway}
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://'+os.environ['AI_BIND_HOST']+':18082/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
